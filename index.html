<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>NETTPRO</title>
<meta name="theme-color" content="#1565c0">
<meta name="description" content="Pointage, planning et suivi des interventions NETTPRO.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NETTPRO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
}

body {
  padding: 0;
}

#appli {
  position: fixed;
  inset: 0;
  display: block;
  width: 100vw;
  height: 100dvh;
  border: 0;
}
  #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #fff; z-index: 5; transition: opacity .3s; }
  #chargement img { width: 88px; height: 88px; }
  #chargement p { margin: 0; color: #64748b; font-size: 14px; }
  .roue { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #1565c0; border-radius: 50%; animation: tourne .8s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  #hors-ligne { display: none; position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 12px); padding: 10px 14px; border-radius: 12px; background: #fef2f2; color: #b91c1c; font-size: 14px; text-align: center; z-index: 20; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  #installer { display: none; position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); padding: 14px; border-radius: 16px; background: #0f172a; color: #fff; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #installer .ligne { display: flex; align-items: center; gap: 12px; }
  #installer img { width: 44px; height: 44px; border-radius: 10px; background: #fff; flex-shrink: 0; }
  #installer strong { display: block; font-size: 15px; }
  #installer span { font-size: 13px; color: #cbd5e1; }
  #installer .actions { display: flex; gap: 8px; margin-top: 12px; }
  #installer button { flex: 1; padding: 10px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 600; }
  #btn-installer { background: #1565c0; color: #fff; }
  #btn-plus-tard { background: #334155; color: #e2e8f0; }
  #etapes { display: none; margin-top: 12px; font-size: 14px; line-height: 1.5; color: #e2e8f0; }
  #etapes ol { margin: 6px 0 0; padding-left: 20px; }
</style>
</head>
<body>

<div id="chargement">
  <img src="icon-192.png" alt="NETTPRO">
  <div class="roue"></div>
  <p>Chargement de NETTPRO…</p>
</div>

<div id="hors-ligne">Pas de connexion internet. L'application se rechargera dès le retour du réseau.</div>

<!-- L'application Apps Script, affichee en plein ecran. La geolocalisation
     sert au pointage, l'appareil photo au scan et aux photos de preuve. -->
<iframe id="appli" title="NETTPRO"
  allow="geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen"
  src="https://script.google.com/macros/s/AKfycbz2vZcGZ2ewoNC1iP6gknl2--qdAPSC5fWh_vTH5LS1TGuIxwMkAogPrRyamQuHtx55lA/exec">
</iframe>
src="https://script.google.com/macros/s/AKfycbz2vZcGZ2ewoNC1iP6gknl2--qdAPSC5fWh_vTH5LS1TGuIxwMkAogPrRyamQuHtx55lA/exec"
<div id="installer" role="dialog" aria-label="Installer l'application">
  <div class="ligne">
    <img src="icon-192.png" alt="">
    <div>
      <strong>Installer NETTPRO</strong>
      <span id="installer-texte">Ajoutez l'application à votre écran d'accueil.</span>
    </div>
  </div>
  <div id="etapes"></div>
  <div class="actions">
    <button id="btn-plus-tard" type="button">Plus tard</button>
    <button id="btn-installer" type="button">Installer</button>
  </div>
</div>

<script>
(function() {
  var appli = document.getElementById('appli');
  var chargement = document.getElementById('chargement');
  var horsLigne = document.getElementById('hors-ligne');

  appli.addEventListener('load', function() {
    chargement.style.opacity = '0';
    setTimeout(function() { chargement.style.display = 'none'; }, 300);
  });

  function majReseau() {
    horsLigne.style.display = navigator.onLine ? 'none' : 'block';
  }
  window.addEventListener('online', function() { majReseau(); appli.src = appli.src; });
  window.addEventListener('offline', majReseau);
  majReseau();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }

  /* ---- Aide a l'installation ----
   * Chaque telephone s'installe differemment : Android propose une vraie
   * boite d'installation, l'iPhone oblige a passer par le bouton Partager.
   * On detecte le cas et on montre les bons gestes, sans rien imposer. */
  var ua = navigator.userAgent || '';
  var estIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var estSafari = estIOS && /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
  var dejaInstallee = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var bandeau = document.getElementById('installer');
  var texte = document.getElementById('installer-texte');
  var etapes = document.getElementById('etapes');
  var btnInstaller = document.getElementById('btn-installer');
  var btnPlusTard = document.getElementById('btn-plus-tard');
  var invite = null;

  function reporte() {
    try { return Number(localStorage.getItem('nettpro_install_reporte') || 0) > Date.now(); }
    catch (e) { return false; }
  }

  function montrer() { if (!dejaInstallee && !reporte()) bandeau.style.display = 'block'; }

  btnPlusTard.addEventListener('click', function() {
    bandeau.style.display = 'none';
    // On ne reposera la question que dans trois jours.
    try { localStorage.setItem('nettpro_install_reporte', String(Date.now() + 3 * 86400000)); } catch (e) {}
  });

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    invite = e;
    montrer();
  });

  window.addEventListener('appinstalled', function() {
    bandeau.style.display = 'none';
  });

  btnInstaller.addEventListener('click', function() {
    if (invite) {
      invite.prompt();
      invite.userChoice.then(function() { invite = null; bandeau.style.display = 'none'; });
      return;
    }
    if (estIOS && !estSafari) {
      etapes.innerHTML = 'Sur iPhone, l\u2019installation se fait depuis <b>Safari</b> : ouvrez cette page dans Safari, puis suivez les étapes.';
    } else if (estIOS) {
      etapes.innerHTML = '<ol><li>Touchez le bouton <b>Partager</b> en bas de l\u2019écran (le carré avec une flèche vers le haut).</li>'
        + '<li>Faites défiler et choisissez <b>Sur l\u2019écran d\u2019accueil</b>.</li>'
        + '<li>Touchez <b>Ajouter</b> en haut à droite.</li></ol>';
    } else {
      etapes.innerHTML = '<ol><li>Ouvrez le menu du navigateur (les trois points en haut à droite).</li>'
        + '<li>Choisissez <b>Installer l\u2019application</b> ou <b>Ajouter à l\u2019écran d\u2019accueil</b>.</li>'
        + '<li>Confirmez.</li></ol>';
    }
    etapes.style.display = 'block';
    btnInstaller.style.display = 'none';
    btnPlusTard.textContent = 'Fermer';
  });

  // Sur iPhone il n'y a pas d'evenement d'installation : on propose l'aide
  // directement. Ailleurs, on attend que le navigateur signale qu'il peut
  // installer, et sinon on propose quand meme l'aide au bout de quelques secondes.
  if (estIOS) {
    texte.textContent = 'Ajoutez-la à votre écran d\u2019accueil pour l\u2019ouvrir en un geste.';
    setTimeout(montrer, 2500);
  } else {
    setTimeout(function() { if (!invite) montrer(); }, 6000);
  }
})();
</script>
</body>
</html>
